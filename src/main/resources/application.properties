spring.application.name=filapedidos

# Configuração do banco H2
spring.datasource.url=jdbc:h2:file:./data/filapedidos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console web do H2 (somente desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE


server.address=0.0.0.0
server.port=8080

spring.thymeleaf.cache=false

# Administrador inicial: substitua os valores por variáveis de ambiente no servidor.
# O usuário é criado somente se ainda não existir no banco H2.
app.security.initial-admin.username=${APP_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${APP_ADMIN_PASSWORD:admin123}
app.security.initial-admin.nome=${APP_ADMIN_NAME:Administrador}
