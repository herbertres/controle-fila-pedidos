
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, conteudo)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo}">FilaPedidos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">

        <!-- Marca -->
        <a class="navbar-brand fw-bold d-flex align-items-center"
           th:href="@{/pedido/lista}">

            <img th:src="@{/img/tito.png}"
                 alt="Logo FilaPedidos"
                 style="height: 40px; width: auto; margin-right: 10px;">

            <span>FilaPedidos</span>
        </a>

        <!-- Botão mobile -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">

                <!-- PEDIDOS -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="menuPedidos"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <span class="me-1">▤</span>
                        Pedidos
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end"
                        aria-labelledby="menuPedidos">

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/pedido/novo}">
                                Cadastrar pedido
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/pedido/lista}">
                                Listar pedidos
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/pedido/editar}">
                                Editar pedido
                            </a>
                        </li>

                    </ul>
                </li>

                <!-- PAINEL -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/pedido/painel}"
                       target="_blank"
                       rel="noopener">
                        <span class="me-1">▣</span>
                        Painel de retirada
                    </a>
                </li>

                <!-- SEPARADOR VISUAL -->
                <li class="nav-item d-none d-lg-block">
                    <span class="text-white-50 px-2">|</span>
                </li>

                <!-- CONTA DO USUÁRIO -->
                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle d-flex align-items-center"
                       href="#"
                       id="menuUsuario"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             fill="currentColor"
                             viewBox="0 0 16 16"
                             class="me-1">

                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                            <path d="M14 14s-1-4-6-4-6 4-6 4v1h12v-1z"/>
                        </svg>

                        <span class="d-lg-none">Minha conta</span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end"
                        aria-labelledby="menuUsuario">

                        <li>
                            <h6 class="dropdown-header">
                                Minha conta
                            </h6>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/usuario/alterar-senha}">
                                Alterar senha
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form th:action="@{/logout}"
                                  method="post">

                                <button type="submit"
                                        class="dropdown-item text-danger">
                                    Sair do sistema
                                </button>

                            </form>
                        </li>

                    </ul>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Conteúdo específico de cada página -->
<main class="container py-4">

    <!-- Mensagem de sucesso -->
    <div th:if="${mensagem != null}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${mensagem}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Fechar">
        </button>
    </div>

    <div th:replace="${conteudo}"></div>

</main>

<!-- Scripts comuns -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
