
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Alterar senha', ~{::conteudo})}">

<body>
<section th:fragment="conteudo">

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="mb-4">
                <h2 class="h3 mb-1">Alterar senha</h2>
                <p class="text-secondary mb-0">
                    Informe sua senha atual e escolha uma nova senha.
                </p>
            </div>

            <div th:if="${erro}"
                 class="alert alert-danger"
                 role="alert"
                 th:text="${erro}">
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/usuario/alterar-senha}"
                          method="post">

                        <div class="mb-3">
                            <label for="senhaAtual"
                                   class="form-label">
                                Senha atual
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="senhaAtual"
                                   name="senhaAtual"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="novaSenha"
                                   class="form-label">
                                Nova senha
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="novaSenha"
                                   name="novaSenha"
                                   minlength="6"
                                   autocomplete="new-password"
                                   required>

                            <div class="form-text">
                                Utilize pelo menos 6 caracteres.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmarNovaSenha"
                                   class="form-label">
                                Confirme a nova senha
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="confirmarNovaSenha"
                                   name="confirmarNovaSenha"
                                   minlength="6"
                                   autocomplete="new-password"
                                   required>
                        </div>

                        <div class="d-flex flex-wrap gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Salvar nova senha
                            </button>

                            <a th:href="@{/pedido/lista}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</section>
</body>
</html>
