
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Lista de pedidos', ~{::conteudo})}">

<body>

<section th:fragment="conteudo">

    <!-- Cabeçalho da página -->
    <div class="d-flex flex-column flex-md-row
                justify-content-between align-items-md-center gap-3 mb-4">

        <div>
            <h2 class="h3 mb-1">Pedidos</h2>
            <p class="text-secondary mb-0">
                Consulte e gerencie os pedidos cadastrados.
            </p>
        </div>

        <a th:href="@{/pedido/novo}" class="btn btn-primary">
            + Novo pedido
        </a>

    </div>

    <!-- Mensagem de sucesso -->
    <div th:if="${mensagem != null}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${mensagem}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Fechar"></button>
    </div>

    <!-- FILTROS -->

<div class="row g-3 mb-4">

    <!-- Filtro por código -->
    <div class="col-12 col-lg-4">
        <div class="card h-100 filtro-card">
            <div class="card-body">
                <label for="filtroCodigo" class="form-label fw-bold">
                    <i class="bi bi-search"></i> Buscar por código
                </label>

                <input type="text"
                       id="filtroCodigo"
                       class="form-control"
                       placeholder="Digite o código do pedido...">

                <div class="form-text">
                    Pesquise pelo código do pedido.
                </div>
            </div>
        </div>
    </div>

    <!-- Filtro por status -->
    <div class="col-12 col-lg-8">
        <div class="card h-100 filtro-card filtro-status-card">
            <div class="card-body">
                <div class="fw-bold mb-3">
                    <i class="bi bi-funnel"></i> Status
                </div>

                <div class="d-flex flex-wrap gap-4">
                    <div class="form-check">
                        <input class="form-check-input filtro-status"
                               type="checkbox"
                               id="statusEmPreparo"
                               value="EM_PREPARO"
                               checked>
                        <label class="form-check-label"
                               for="statusEmPreparo">
                            Em preparo
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input filtro-status"
                               type="checkbox"
                               id="statusPronto"
                               value="PRONTO"
                               checked>
                        <label class="form-check-label"
                               for="statusPronto">
                            Pronto
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input filtro-status"
                               type="checkbox"
                               id="statusRetirado"
                               value="RETIRADO"
                               checked>
                        <label class="form-check-label"
                               for="statusRetirado">
                            Retirado
                        </label>
                    </div>
                </div>

                <div class="form-text mt-3">
                    Marque os status que deseja visualizar.
                </div>
            </div>
        </div>
    </div>

</div>


    <!-- Tabela de pedidos -->
    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-3">Código</th>
                            <th scope="col">Data de criação</th>
                            <th scope="col">Plataforma</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="text-center">Ações</th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- Exibido quando não houver pedidos -->
                        <tr th:if="${#lists.isEmpty(pedidos)}">
                            <td colspan="5" class="text-center py-5">
                                <p class="text-secondary mb-2">
                                    Nenhum pedido encontrado.
                                </p>

                                <a th:href="@{/pedido/novo}"
                                   class="btn btn-outline-primary btn-sm">
                                    Cadastrar primeiro pedido
                                </a>
                            </td>
                        </tr>

                        <!-- Uma linha para cada pedido -->
                        <tr th:each="pedido : ${pedidos}" class="linha-pedido" 
                            th:attr="data-status=${pedido.status.name()},data-codigo=${pedido.codigoPedido}">

                            <td class="ps-3 fw-semibold"
                                th:text="${pedido.codigoPedido}">
                            </td>

                            <td class="text-nowrap"
                                th:text="${pedido.dataCriacao != null
                                    ? #temporals.format(pedido.dataCriacao, 'dd/MM/yyyy HH:mm')
                                    : '-'}">
                            </td>

                            <td>
                                <span th:text="${pedido.plataforma.descricao}">
                                </span>
                            </td>

                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${
                                          pedido.status.name() == 'EM_PREPARO'
                                          ? ' text-bg-warning'
                                          : pedido.status.name() == 'PRONTO'
                                          ? ' text-bg-success'
                                          : pedido.status.name() == 'RETIRADO'
                                          ? ' text-bg-secondary'
                                          : ' text-bg-danger'
                                      }"
                                      th:text="${pedido.status.name()
                                          .replace('_', ' ')}">
                                </span>
                            </td>

                            <!-- Ações do registro -->
                            <td>
                                <div class="d-flex justify-content-center
                                            flex-wrap gap-1">


                                    <!-- Marcar como pronto -->
                                    <form th:if="${pedido.status.name() == 'EM_PREPARO'}" th:action="@{/pedido/{id}/pronto(id=${pedido.id})}" method="post"
                                        class="d-inline">
                                    
                                        <button type="submit" class="btn btn-outline-success btn-sm">
                                            Pronto
                                        </button>
                                    </form>

                                    <!-- Marcar como retirado -->
                                    <form th:if="${pedido.status.name() == 'PRONTO'}" th:action="@{/pedido/{id}/retirado(id=${pedido.id})}" method="post"
                                        class="d-inline">
                                    
                                        <button type="submit" class="btn btn-outline-primary btn-sm">
                                            Retirado
                                        </button>
                                    </form>

                                </div>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Rodapé da tabela -->
        <div class="card-footer bg-white text-secondary small"
             th:unless="${#lists.isEmpty(pedidos)}">

            Total de pedidos:
            <strong th:text="${#lists.size(pedidos)}">0</strong>

        </div>

    </div>

<script>

const filtroCodigo = document.getElementById("filtroCodigo");
const filtrosStatus = document.querySelectorAll(".filtro-status");
const linhasPedidos = document.querySelectorAll(".linha-pedido");

function aplicarFiltros() {
    const codigo = filtroCodigo.value.trim().toLowerCase();

    const statusSelecionados = Array.from(filtrosStatus)
        .filter(filtro => filtro.checked)
        .map(filtro => filtro.value);

    linhasPedidos.forEach(linha => {
        const codigoPedido = (
            linha.dataset.codigo || ""
        ).toLowerCase();

        const statusPedido = linha.dataset.status;

        const correspondeCodigo = codigoPedido.includes(codigo);

        const correspondeStatus =
            statusSelecionados.includes(statusPedido);

        linha.hidden = !(
            correspondeCodigo && correspondeStatus
        );
    });
}

filtroCodigo.addEventListener("input", aplicarFiltros);

filtrosStatus.forEach(filtro => {
    filtro.addEventListener("change", aplicarFiltros);
});

</script>

</section>




</body>
</html>
