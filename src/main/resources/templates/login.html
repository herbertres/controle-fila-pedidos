<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FilaPedidos | Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img th:src="@{/img/tito.png}" alt="FilaPedidos"
                     style="height: 65px; width: auto;">
                <h1 class="h4 mt-3 mb-1">FilaPedidos</h1>
                <p class="text-secondary mb-0">Acesse sua conta</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos, ou usuário desativado.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Você saiu do sistema.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input id="username" name="username" type="text"
                           class="form-control" autocomplete="username"
                           required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input id="password" name="password" type="password"
                           class="form-control" autocomplete="current-password"
                           required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
